name: Auto Video Generator

on:
  workflow_dispatch: # يسمح بتشغيله يدوياً من علامة تبويب Actions في جيت هب
  schedule:
    - cron: '0 0 * * *' # أو أوتوماتيك كل يوم

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Video Generator Script
        run: |
          python generate_video.py

      - name: Commit and Push Generated Video & Database
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add instance/13vidio.db static/ generated_video.mp4 || true
          git commit -m "🤖 Auto-generated new video and updated database" || true
          git push || true
